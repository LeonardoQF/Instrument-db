spring:
  application:
    name: Tests
  datasource:
    url: jdbc:h2:mem:lel
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /db
  jpa:
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
        
        
      
config: 
  storage:
    pathName: C:\instrument-db_storage\images
    supportedImageTypes:
      - .jpg
      - .jpeg
      - .png
    maxImageSizeBytes: 5000000
    maxImagesPerFolder: 5

  
  
      
